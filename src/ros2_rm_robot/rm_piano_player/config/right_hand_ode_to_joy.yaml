# Record GUI COMMAND targets, not raw feedback or a 30-register array.
# 20 slots: ROOT thumb..little, YAW thumb..little, ROLL thumb..little,
# TIP thumb..little. Every value must be finite and within 0..255.
# Candidate mapping only: thumb C4(60), index D4(62), middle E4(64),
# ring F4(65), little G4(67). Confirm coverage with the actual mounting.
# pose_test permits unverified filled poses. melody requires all six verified.
# Sources updated 2026-10-23; read READY entries, ignore legacy PRESS_C entries.
# E/F/G are estimates: transfer index deltas to the target finger in each group.
# D/E/F/G: scale all deltas from READY by 0.5 after import/transfer.
# Four-finger opening adjustment: add 15 to ROOT slots 01..04 and TIP 16..19
# in all six poses. Thumb/YAW/ROLL unchanged; press-minus-READY deltas preserved.
# Imported READY and PRESS_C are also shifted in those eight non-thumb slots.
# verified flags retained per user request, not evidence of hardware validation.
