controller_manager:
  ros__parameters:
    update_rate: 100
    rm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    l20_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

rm_group_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

l20_hand_controller:
  ros__parameters:
    joints:
      - thumb_joint0
      - thumb_joint1
      - thumb_joint2
      - thumb_joint3
      - thumb_joint4
      - index_joint0
      - index_joint1
      - index_joint2
      - index_joint3
      - middle_joint0
      - middle_joint1
      - middle_joint2
      - middle_joint3
      - ring_joint0
      - ring_joint1
      - ring_joint2
      - ring_joint3
      - little_joint0
      - little_joint1
      - little_joint2
      - little_joint3
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
