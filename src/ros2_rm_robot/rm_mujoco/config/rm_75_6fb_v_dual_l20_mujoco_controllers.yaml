controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_l20_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_l20_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

left_arm_controller:
  ros__parameters:
    joints: [left_joint1, left_joint2, left_joint3, left_joint4, left_joint5, left_joint6, left_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

right_arm_controller:
  ros__parameters:
    joints: [right_joint1, right_joint2, right_joint3, right_joint4, right_joint5, right_joint6, right_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

left_l20_hand_controller:
  ros__parameters:
    joints:
      - left_thumb_joint0
      - left_thumb_joint1
      - left_thumb_joint2
      - left_thumb_joint3
      - left_thumb_joint4
      - left_index_joint0
      - left_index_joint1
      - left_index_joint2
      - left_index_joint3
      - left_middle_joint0
      - left_middle_joint1
      - left_middle_joint2
      - left_middle_joint3
      - left_ring_joint0
      - left_ring_joint1
      - left_ring_joint2
      - left_ring_joint3
      - left_little_joint0
      - left_little_joint1
      - left_little_joint2
      - left_little_joint3
    command_interfaces: [position]
    state_interfaces: [position, velocity]

right_l20_hand_controller:
  ros__parameters:
    joints:
      - right_thumb_joint0
      - right_thumb_joint1
      - right_thumb_joint2
      - right_thumb_joint3
      - right_thumb_joint4
      - right_index_joint0
      - right_index_joint1
      - right_index_joint2
      - right_index_joint3
      - right_middle_joint0
      - right_middle_joint1
      - right_middle_joint2
      - right_middle_joint3
      - right_ring_joint0
      - right_ring_joint1
      - right_ring_joint2
      - right_ring_joint3
      - right_little_joint0
      - right_little_joint1
      - right_little_joint2
      - right_little_joint3
    command_interfaces: [position]
    state_interfaces: [position, velocity]
