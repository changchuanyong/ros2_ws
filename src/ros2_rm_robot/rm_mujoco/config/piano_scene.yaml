# The whole piano (case, keys, pedals, press points) follows this frame.
# Position chosen by a flat-wrist posture sweep (see .validation sweep README):
# 0.00-0.20 all cover 20/22 right-hand notes; y=0.15 maximises the worst joint
# margin (0.292 rad); >=0.25 over-reaches the treble; >=0.55 unreachable.
piano_frame:
  position: [0.0, 0.15, 0.74]
keyboard:
  white_pitch: 0.0236
  white_depth: 0.15
  # 22 mm is a real key body height; 12 mm read as loose tiles on the keybed.
  white_thickness: 0.022
  black_width: 0.0135
  black_depth: 0.085
  # Top surface above the white-key top, and the full body height that reaches
  # down into the keybed so a pressed white key never reveals a floating key.
  black_height: 0.0125
  black_body_height: 0.034
  gap: 0.001
piano:
  width: 1.40
  depth: 0.44
background:
  enabled: true
